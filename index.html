<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 Floating Panel</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: ButtonFace;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI Variable Text', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* Floating Panel Container - Style Windows 11 Fluent */
        .win11-panel {
            position: absolute;
            top: 50px;
            left: 50px;
            width: 400px;
            height: 300px;
            min-width: 200px;
            min-height: 150px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18), 0 0 0 1px rgba(255, 255, 255, 0.4) inset;
            display: flex;
            flex-direction: column;
            transition: border-radius 0.2s, width 0.1s, height 0.1s;
        }

        .win11-panel.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0;
            border: none;
        }

        /* Title Bar */
        .title-bar {
            height: 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 12px;
            cursor: default;
        }

        .title-bar .title {
            font-size: 12px;
            color: #1a1a1a;
            font-weight: 400;
        }

        /* Control Buttons */
        .controls {
            display: flex;
            height: 100%;
        }

        .btn {
            width: 46px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .btn:hover {
            background-color: rgba(0, 0, 0, 0.06);
        }

        .btn-close:hover {
            background-color: #c42b1c !important;
        }

        .btn-close:hover svg path {
            fill: #ffffff;
        }

        .btn svg {
            width: 10px;
            height: 10px;
        }

        /* Content Area */
        .panel-content {
            flex: 1;
            padding: 16px;
            color: #1c1c1c;
            overflow: auto;
            user-select: text;
        }

        /* Resize Handles (8 Sisi) */
        .resizer {
            position: absolute;
        }

        .resizer.n  { top: -4px; left: 6px; right: 6px; height: 8px; cursor: ns-resize; }
        .resizer.s  { bottom: -4px; left: 6px; right: 6px; height: 8px; cursor: ns-resize; }
        .resizer.e  { right: -4px; top: 6px; bottom: 6px; width: 8px; cursor: ew-resize; }
        .resizer.w  { left: -4px; top: 6px; bottom: 6px; width: 8px; cursor: ew-resize; }
        .resizer.nw { top: -4px; left: -4px; width: 10px; height: 10px; cursor: nwse-resize; }
        .resizer.ne { top: -4px; right: -4px; width: 10px; height: 10px; cursor: nesw-resize; }
        .resizer.sw { bottom: -4px; left: -4px; width: 10px; height: 10px; cursor: nesw-resize; }
        .resizer.se { bottom: -4px; right: -4px; width: 10px; height: 10px; cursor: nwse-resize; }
    </style>
</head>
<body>

    <div class="win11-panel" id="panel">
        <!-- Title Bar -->
        <div class="title-bar" id="titleBar">
            <span class="title">Windows 11 Panel</span>
            <div class="controls">
                <button class="btn btn-max-restore" id="btnMaxRestore" title="Maximize">
                    <svg id="iconMax" viewBox="0 0 10 10"><path d="M0,0 v10 h10 v-10 h-10 Z M9,9 h-8 v-8 h8 v8 Z" fill="#000"/></svg>
                    <svg id="iconRestore" viewBox="0 0 10 10" style="display:none;"><path d="M2,0 v2 h-2 v8 h8 v-2 h2 v-8 h-8 Z M7,9 h-6 v-6 h6 v6 Z M9,7 h-1 v-4 h-4 v-1 h5 v5 Z" fill="#000"/></svg>
                </button>
                <button class="btn btn-close" id="btnClose" title="Close">
                    <svg viewBox="0 0 10 10"><path d="M0.5,0 L0,0.5 L4.5,5 L0,9.5 L0.5,10 L5,5.5 L9.5,10 L10,9.5 L5.5,5 L10,0.5 L9.5,0 L5,4.5 Z" fill="#000"/></svg>
                </button>
            </div>
        </div>

        <!-- Content Area -->
        <div class="panel-content">
            <p>Konten panel di sini...</p>
        </div>

        <!-- Resize Handles -->
        <div class="resizer n"></div>
        <div class="resizer s"></div>
        <div class="resizer e"></div>
        <div class="resizer w"></div>
        <div class="resizer nw"></div>
        <div class="resizer ne"></div>
        <div class="resizer sw"></div>
        <div class="resizer se"></div>
    </div>

    <script>
        const panel = document.getElementById('panel');
        const titleBar = document.getElementById('titleBar');
        const btnClose = document.getElementById('btnClose');
        const btnMaxRestore = document.getElementById('btnMaxRestore');
        const iconMax = document.getElementById('iconMax');
        const iconRestore = document.getElementById('iconRestore');

        let isMaximized = false;
        let prevRect = {};

        // 1. Drag / Move Panel
        let isDragging = false, startX, startY, initialLeft, initialTop;

        titleBar.addEventListener('mousedown', (e) => {
            if (e.target.closest('.controls') || isMaximized) return;
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            initialLeft = panel.offsetLeft;
            initialTop = panel.offsetTop;
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);
        });

        function onDrag(e) {
            if (!isDragging) return;
            panel.style.left = `${initialLeft + (e.clientX - startX)}px`;
            panel.style.top = `${initialTop + (e.clientY - startY)}px`;
        }

        function stopDrag() {
            isDragging = false;
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', stopDrag);
        }

        // 2. Maximize & Restore
        btnMaxRestore.addEventListener('click', toggleMaximize);

        function toggleMaximize() {
            if (!isMaximized) {
                prevRect = {
                    top: panel.offsetTop,
                    left: panel.offsetLeft,
                    width: panel.offsetWidth,
                    height: panel.offsetHeight
                };
                panel.classList.add('maximized');
                iconMax.style.display = 'none';
                iconRestore.style.display = 'block';
                btnMaxRestore.title = "Restore";
                isMaximized = true;
            } else {
                panel.classList.remove('maximized');
                panel.style.top = `${prevRect.top}px`;
                panel.style.left = `${prevRect.left}px`;
                panel.style.width = `${prevRect.width}px`;
                panel.style.height = `${prevRect.height}px`;
                iconMax.style.display = 'block';
                iconRestore.style.display = 'none';
                btnMaxRestore.title = "Maximize";
                isMaximized = false;
            }
        }

        // 3. Close Panel
        btnClose.addEventListener('click', () => {
            panel.style.display = 'none';
        });

        // 4. Resize 8 Sisi
        const resizers = document.querySelectorAll('.resizer');
        let currentResizer;

        resizers.forEach(resizer => {
            resizer.addEventListener('mousedown', (e) => {
                if (isMaximized) return;
                e.preventDefault();
                currentResizer = resizer;
                
                let prevX = e.clientX;
                let prevY = e.clientY;

                function onResize(e) {
                    const rect = panel.getBoundingClientRect();
                    const dx = e.clientX - prevX;
                    const dy = e.clientY - prevY;

                    if (currentResizer.classList.contains('e')) {
                        panel.style.width = `${rect.width + dx}px`;
                    } else if (currentResizer.classList.contains('s')) {
                        panel.style.height = `${rect.height + dy}px`;
                    } else if (currentResizer.classList.contains('w')) {
                        panel.style.width = `${rect.width - dx}px`;
                        panel.style.left = `${rect.left + dx}px`;
                    } else if (currentResizer.classList.contains('n')) {
                        panel.style.height = `${rect.height - dy}px`;
                        panel.style.top = `${rect.top + dy}px`;
                    } else if (currentResizer.classList.contains('se')) {
                        panel.style.width = `${rect.width + dx}px`;
                        panel.style.height = `${rect.height + dy}px`;
                    } else if (currentResizer.classList.contains('sw')) {
                        panel.style.width = `${rect.width - dx}px`;
                        panel.style.height = `${rect.height + dy}px`;
                        panel.style.left = `${rect.left + dx}px`;
                    } else if (currentResizer.classList.contains('ne')) {
                        panel.style.width = `${rect.width + dx}px`;
                        panel.style.height = `${rect.height - dy}px`;
                        panel.style.top = `${rect.top + dy}px`;
                    } else if (currentResizer.classList.contains('nw')) {
                        panel.style.width = `${rect.width - dx}px`;
                        panel.style.height = `${rect.height - dy}px`;
                        panel.style.left = `${rect.left + dx}px`;
                        panel.style.top = `${rect.top + dy}px`;
                    }

                    prevX = e.clientX;
                    prevY = e.clientY;
                }

                function stopResize() {
                    window.removeEventListener('mousemove', onResize);
                    window.removeEventListener('mouseup', stopResize);
                }

                window.addEventListener('mousemove', onResize);
                window.addEventListener('mouseup', stopResize);
            });
        });
    </script>
</body>
</html>
