<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: ButtonFace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI Variable Text', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* Dashboard UI (Di Body Utama) */
        .dashboard {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: #f3f3f3;
        }

        .sidebar {
            width: 240px;
            background: #ffffff;
            border-right: 1px solid rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            padding: 20px 12px;
            gap: 8px;
        }

        .sidebar .brand {
            font-size: 16px;
            font-weight: 600;
            padding: 8px 12px;
            margin-bottom: 12px;
            color: #005fb8;
        }

        .nav-item {
            padding: 10px 12px;
            border-radius: 4px;
            color: #1a1a1a;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(0, 0, 0, 0.05);
        }

        .main-content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .main-content h1 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .main-content p {
            color: #555;
            font-size: 14px;
        }

        /* Floating Panel Style (Windows 11 Fluent) */
        .win11-panel {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18), 0 0 0 1px rgba(255, 255, 255, 0.4) inset;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 320px;
            min-height: 380px;
            touch-action: none;
        }

        .win11-panel.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0 !important;
            border: none !important;
        }

        /* Title Bar */
        .title-bar {
            height: 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 12px;
            background: transparent;
            cursor: default;
            flex-shrink: 0;
        }

        .title-bar .title {
            font-size: 12px;
            color: #1a1a1a;
            font-weight: 400;
        }

        /* Control Buttons */
        .controls {
            display: flex;
            height: 100%;
        }

        .btn {
            width: 46px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .btn:hover {
            background-color: rgba(0, 0, 0, 0.06);
        }

        .btn-close:hover {
            background-color: #c42b1c !important;
        }

        .btn-close:hover svg path {
            fill: #ffffff;
        }

        .btn svg {
            width: 10px;
            height: 10px;
        }

        /* Content Area & Form Style */
        .panel-content {
            flex: 1;
            padding: 24px;
            color: #1c1c1c;
            overflow: auto;
            user-select: text;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 12px;
            color: #333;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            padding: 8px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            outline: none;
            transition: border-color 0.15s, background-color 0.15s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #005fb8;
            background: #ffffff;
        }

        .btn-submit {
            margin-top: 10px;
            padding: 9px;
            background: #005fb8;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-submit:hover {
            background: #004e9a;
        }

        /* Resize Handles (8 Sisi) */
        .resizer {
            position: absolute;
            z-index: 10;
        }

        .resizer.n  { top: 0; left: 8px; right: 8px; height: 5px; cursor: ns-resize; }
        .resizer.s  { bottom: 0; left: 8px; right: 8px; height: 5px; cursor: ns-resize; }
        .resizer.e  { right: 0; top: 8px; bottom: 8px; width: 5px; cursor: ew-resize; }
        .resizer.w  { left: 0; top: 8px; bottom: 8px; width: 5px; cursor: ew-resize; }
        .resizer.nw { top: 0; left: 0; width: 8px; height: 8px; cursor: nwse-resize; }
        .resizer.ne { top: 0; right: 0; width: 8px; height: 8px; cursor: nesw-resize; }
        .resizer.sw { bottom: 0; left: 0; width: 8px; height: 8px; cursor: nesw-resize; }
        .resizer.se { bottom: 0; right: 0; width: 8px; height: 8px; cursor: nwse-resize; }
    </style>
</head>
<body>

    <!-- Home Dashboard (Body Utama) -->
    <div class="dashboard">
        <div class="sidebar">
            <div class="brand">App Portal</div>
            <div class="nav-item active">Dashboard</div>
            <div class="nav-item">Analytics</div>
            <div class="nav-item">Inventory</div>
            <div class="nav-item">Settings</div>
        </div>
        <div class="main-content">
            <h1>Selamat Datang di System Dashboard</h1>
            <p>Silakan selesaikan proses login pada floating window untuk mengakses seluruh fitur.</p>
        </div>
    </div>

    <script>
        let highestZIndex = 100;

        class Win11Panel {
            constructor(options = {}) {
                this.title = options.title || 'Panel Window';
                this.content = options.content || '';
                this.width = options.width || 380;
                this.height = options.height || 420;
                this.x = options.x || 100;
                this.y = options.y || 80;
                this.minWidth = options.minWidth || 300;
                this.minHeight = options.minHeight || 350;

                this.isMaximized = false;
                this.prevRect = {};

                this.init();
            }

            init() {
                this.el = document.createElement('div');
                this.el.className = 'win11-panel';
                this.el.style.width = `${this.width}px`;
                this.el.style.height = `${this.height}px`;
                this.el.style.left = `${this.x}px`;
                this.el.style.top = `${this.y}px`;
                this.bringToFront();

                this.el.innerHTML = `
                    <div class="title-bar">
                        <span class="title">${this.title}</span>
                        <div class="controls">
                            <button class="btn btn-max-restore" title="Maximize">
                                <svg class="icon-max" viewBox="0 0 10 10"><path d="M0,0 v10 h10 v-10 h-10 Z M9,9 h-8 v-8 h8 v8 Z" fill="#000"/></svg>
                                <svg class="icon-restore" viewBox="0 0 10 10" style="display:none;"><path d="M2,0 v2 h-2 v8 h8 v-2 h2 v-8 h-8 Z M7,9 h-6 v-6 h6 v6 Z M9,7 h-1 v-4 h-4 v-1 h5 v5 Z" fill="#000"/></svg>
                            </button>
                            <button class="btn btn-close" title="Close">
                                <svg viewBox="0 0 10 10"><path d="M0.5,0 L0,0.5 L4.5,5 L0,9.5 L0.5,10 L5,5.5 L9.5,10 L10,9.5 L5.5,5 L10,0.5 L9.5,0 L5,4.5 Z" fill="#000"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="panel-content">${this.content}</div>
                    <div class="resizer n"></div>
                    <div class="resizer s"></div>
                    <div class="resizer e"></div>
                    <div class="resizer w"></div>
                    <div class="resizer nw"></div>
                    <div class="resizer ne"></div>
                    <div class="resizer sw"></div>
                    <div class="resizer se"></div>
                `;

                document.body.appendChild(this.el);

                this.titleBar = this.el.querySelector('.title-bar');
                this.btnMaxRestore = this.el.querySelector('.btn-max-restore');
                this.btnClose = this.el.querySelector('.btn-close');
                this.iconMax = this.el.querySelector('.icon-max');
                this.iconRestore = this.el.querySelector('.icon-restore');

                this.el.addEventListener('mousedown', () => this.bringToFront());
                this.initDrag();
                this.initResize();

                this.btnMaxRestore.addEventListener('click', () => this.toggleMaximize());
                this.btnClose.addEventListener('click', () => this.close());
            }

            bringToFront() {
                highestZIndex++;
                this.el.style.zIndex = highestZIndex;
            }

            initDrag() {
                let startX, startY, initX, initY;

                const onMouseMove = (e) => {
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    this.el.style.left = `${initX + dx}px`;
                    this.el.style.top = `${initY + dy}px`;
                };

                const onMouseUp = () => {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };

                this.titleBar.addEventListener('mousedown', (e) => {
                    if (e.target.closest('.controls') || this.isMaximized) return;
                    startX = e.clientX;
                    startY = e.clientY;
                    initX = this.el.offsetLeft;
                    initY = this.el.offsetTop;

                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                });
            }

            initResize() {
                const resizers = this.el.querySelectorAll('.resizer');

                resizers.forEach(resizer => {
                    resizer.addEventListener('mousedown', (e) => {
                        if (this.isMaximized) return;
                        e.preventDefault();

                        const startX = e.clientX;
                        const startY = e.clientY;
                        const startWidth = this.el.offsetWidth;
                        const startHeight = this.el.offsetHeight;
                        const startLeft = this.el.offsetLeft;
                        const startTop = this.el.offsetTop;

                        const onMouseMove = (moveEvent) => {
                            const dx = moveEvent.clientX - startX;
                            const dy = moveEvent.clientY - startY;

                            if (resizer.classList.contains('e') || resizer.classList.contains('ne') || resizer.classList.contains('se')) {
                                const newWidth = startWidth + dx;
                                if (newWidth >= this.minWidth) this.el.style.width = `${newWidth}px`;
                            }
                            if (resizer.classList.contains('s') || resizer.classList.contains('sw') || resizer.classList.contains('se')) {
                                const newHeight = startHeight + dy;
                                if (newHeight >= this.minHeight) this.el.style.height = `${newHeight}px`;
                            }
                            if (resizer.classList.contains('w') || resizer.classList.contains('nw') || resizer.classList.contains('sw')) {
                                const newWidth = startWidth - dx;
                                if (newWidth >= this.minWidth) {
                                    this.el.style.width = `${newWidth}px`;
                                    this.el.style.left = `${startLeft + dx}px`;
                                }
                            }
                            if (resizer.classList.contains('n') || resizer.classList.contains('nw') || resizer.classList.contains('ne')) {
                                const newHeight = startHeight - dy;
                                if (newHeight >= this.minHeight) {
                                    this.el.style.height = `${newHeight}px`;
                                    this.el.style.top = `${startTop + dy}px`;
                                }
                            }
                        };

                        const onMouseUp = () => {
                            document.removeEventListener('mousemove', onMouseMove);
                            document.removeEventListener('mouseup', onMouseUp);
                        };

                        document.addEventListener('mousemove', onMouseMove);
                        document.addEventListener('mouseup', onMouseUp);
                    });
                });
            }

            toggleMaximize() {
                if (!this.isMaximized) {
                    this.prevRect = {
                        top: this.el.offsetTop,
                        left: this.el.offsetLeft,
                        width: this.el.offsetWidth,
                        height: this.el.offsetHeight
                    };
                    this.el.classList.add('maximized');
                    this.iconMax.style.display = 'none';
                    this.iconRestore.style.display = 'block';
                    this.btnMaxRestore.title = "Restore";
                    this.isMaximized = true;
                } else {
                    this.el.classList.remove('maximized');
                    this.el.style.top = `${this.prevRect.top}px`;
                    this.el.style.left = `${this.prevRect.left}px`;
                    this.el.style.width = `${this.prevRect.width}px`;
                    this.el.style.height = `${this.prevRect.height}px`;
                    this.iconMax.style.display = 'block';
                    this.iconRestore.style.display = 'none';
                    this.btnMaxRestore.title = "Maximize";
                    this.isMaximized = false;
                }
            }

            close() {
                this.el.remove();
            }
        }

        // HTML Template Form Login
        const loginFormTemplate = `
            <form class="login-form" onsubmit="event.preventDefault(); alert('Login submitted!');">
                <div class="form-group">
                    <label for="client">Client</label>
                    <input type="text" id="client" placeholder="Masukkan Client Code">
                </div>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Masukkan Username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label for="language">Language</label>
                    <select id="language">
                        <option value="en">English (EN)</option>
                        <option value="id">Bahasa Indonesia (ID)</option>
                        <option value="jp">Japanese (JP)</option>
                        <option value="cn">Chinese (CN)</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Sign In</button>
            </form>
        `;

        // Inisialisasi Single Panel Login
        const loginPanel = new Win11Panel({
            title: 'System Login',
            content: loginFormTemplate,
            x: Math.max(20, (window.innerWidth - 380) / 2),
            y: Math.max(20, (window.innerHeight - 440) / 2),
            width: 380,
            height: 440
        });
    </script>
</body>
</html>
