<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compact Dashboard System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-size: 11px;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: ButtonFace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI Variable Text', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* Silver Vertical Gradient Button Style */
        .btn-silver {
            background: linear-gradient(to bottom, #ffffff 0%, #f0f0f0 50%, #e1e1e1 51%, #d6d6d6 100%);
            border: 1px solid #adadad;
            border-radius: 4px;
            color: #222;
            padding: 4px 10px;
            cursor: pointer;
            outline: none;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
            transition: all 0.1s ease;
        }

        .btn-silver:hover {
            background: linear-gradient(to bottom, #ffffff 0%, #ebebeb 50%, #d8d8d8 51%, #cccccc 100%);
            border-color: #8e8e8e;
        }

        .btn-silver:active {
            background: linear-gradient(to bottom, #d6d6d6 0%, #e1e1e1 50%, #f0f0f0 51%, #ffffff 100%);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
        }

        /* Dashboard Area (Hidden by default) */
        .dashboard {
            display: none;
            height: 100vh;
            width: 100vw;
            background: #f3f3f3;
            position: relative;
        }

        .dashboard.active {
            display: flex;
        }

        .sidebar {
            width: 180px;
            background: #ffffff;
            border-right: 1px solid rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            padding: 10px 8px;
            gap: 4px;
            position: relative;
            flex-shrink: 0;
            min-width: 50px;
        }

        /* Resizer Sidebar Right Edge */
        .sidebar-resizer {
            position: absolute;
            top: 0;
            right: -3px;
            width: 6px;
            height: 100%;
            cursor: ew-resize;
            z-index: 20;
        }

        .sidebar .brand {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 6px;
            margin-bottom: 6px;
            color: #004e9a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav-item {
            padding: 5px 8px;
            border-radius: 3px;
            color: #1a1a1a;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(0, 0, 0, 0.06);
        }

        .main-content {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }

        .main-content h1 {
            font-size: 16px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .main-content p {
            color: #555;
        }

        /* Floating Panel Window */
        .win11-panel {
            position: absolute;
            background: rgba(245, 245, 245, 0.88);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 6px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 200px;
            min-height: 28px;
            touch-action: none;
        }

        .win11-panel.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0 !important;
            border: none !important;
        }

        .win11-panel.collapsed {
            height: 28px !important;
            min-height: 28px !important;
        }

        .win11-panel.collapsed .panel-content,
        .win11-panel.collapsed .resizer {
            display: none !important;
        }

        /* Title Bar (Darker Background) */
        .title-bar {
            height: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 8px;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px);
            cursor: default;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.15);
        }

        .title-bar .title {
            font-size: 11px;
            color: #ffffff;
            font-weight: 500;
        }

        /* Control Buttons */
        .controls {
            display: flex;
            height: 100%;
            align-items: center;
            gap: 2px;
            padding-right: 2px;
        }

        .btn-ctrl {
            width: 22px;
            height: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 9px;
            line-height: 1;
            padding: 0;
        }

        .btn-close:hover {
            background: linear-gradient(to bottom, #ff6b6b 0%, #c42b1c 100%) !important;
            border-color: #ab2316 !important;
            color: #ffffff !important;
        }

        /* Content Area */
        .panel-content {
            flex: 1;
            padding: 12px;
            color: #1c1c1c;
            overflow: auto;
            user-select: text;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .form-group label {
            font-size: 10px;
            color: #333;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            padding: 4px 6px;
            border-radius: 3px;
            border: 1px solid rgba(0, 0, 0, 0.25);
            background: rgba(255, 255, 255, 0.9);
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #005fb8;
            background: #ffffff;
        }

        .btn-submit {
            margin-top: 6px;
            padding: 5px;
            font-weight: 600;
        }

        /* Resize Handles (8 Sisi) */
        .resizer { position: absolute; z-index: 10; }
        .resizer.n  { top: 0; left: 6px; right: 6px; height: 4px; cursor: ns-resize; }
        .resizer.s  { bottom: 0; left: 6px; right: 6px; height: 4px; cursor: ns-resize; }
        .resizer.e  { right: 0; top: 6px; bottom: 6px; width: 4px; cursor: ew-resize; }
        .resizer.w  { left: 0; top: 6px; bottom: 6px; width: 4px; cursor: ew-resize; }
        .resizer.nw { top: 0; left: 0; width: 6px; height: 6px; cursor: nwse-resize; }
        .resizer.ne { top: 0; right: 0; width: 6px; height: 6px; cursor: nesw-resize; }
        .resizer.sw { bottom: 0; left: 0; width: 6px; height: 6px; cursor: nesw-resize; }
        .resizer.se { bottom: 0; right: 0; width: 6px; height: 6px; cursor: nwse-resize; }
    </style>
</head>
<body>

    <!-- Dashboard Main View (Sembunyi saat Session Login) -->
    <div class="dashboard" id="dashboard">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-resizer" id="sidebarResizer"></div>
            <div class="brand">App Portal</div>
            <div class="nav-item active">Dashboard</div>
            <div class="nav-item">Analytics</div>
            <div class="nav-item">Inventory</div>
            <div class="nav-item">Settings</div>
        </div>
        <div class="main-content">
            <h1>Sistem Utama</h1>
            <p>Sesi login aktif. Selamat bekerja.</p>
        </div>
    </div>

    <script>
        let highestZIndex = 100;

        class Win11Panel {
            constructor(options = {}) {
                this.title = options.title || 'Panel Window';
                this.content = options.content || '';
                this.width = options.width || 280;
                this.height = options.height || 260;
                this.x = options.x || 80;
                this.y = options.y || 60;
                this.minWidth = options.minWidth || 200;
                this.minHeight = options.minHeight || 180;

                this.isMaximized = false;
                this.isCollapsed = false;
                this.prevRect = {};

                this.init();
            }

            init() {
                this.el = document.createElement('div');
                this.el.className = 'win11-panel';
                this.el.style.width = `${this.width}px`;
                this.el.style.height = `${this.height}px`;
                this.el.style.left = `${this.x}px`;
                this.el.style.top = `${this.y}px`;
                this.bringToFront();

                this.el.innerHTML = `
                    <div class="title-bar">
                        <span class="title">${this.title}</span>
                        <div class="controls">
                            <button class="btn-silver btn-ctrl btn-collapse" title="Collapse/Expand">&#8722;</button>
                            <button class="btn-silver btn-ctrl btn-max-restore" title="Maximize">&#9633;</button>
                            <button class="btn-silver btn-ctrl btn-close" title="Close">&#10005;</button>
                        </div>
                    </div>
                    <div class="panel-content">${this.content}</div>
                    <div class="resizer n"></div>
                    <div class="resizer s"></div>
                    <div class="resizer e"></div>
                    <div class="resizer w"></div>
                    <div class="resizer nw"></div>
                    <div class="resizer ne"></div>
                    <div class="resizer sw"></div>
                    <div class="resizer se"></div>
                `;

                document.body.appendChild(this.el);

                this.titleBar = this.el.querySelector('.title-bar');
                this.btnCollapse = this.el.querySelector('.btn-collapse');
                this.btnMaxRestore = this.el.querySelector('.btn-max-restore');
                this.btnClose = this.el.querySelector('.btn-close');

                this.el.addEventListener('mousedown', () => this.bringToFront());
                this.initDrag();
                this.initResize();

                this.btnCollapse.addEventListener('click', () => this.toggleCollapse());
                this.btnMaxRestore.addEventListener('click', () => this.toggleMaximize());
                this.btnClose.addEventListener('click', () => this.close());
            }

            bringToFront() {
                highestZIndex++;
                this.el.style.zIndex = highestZIndex;
            }

            initDrag() {
                let startX, startY, initX, initY;

                const onMouseMove = (e) => {
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    this.el.style.left = `${initX + dx}px`;
                    this.el.style.top = `${initY + dy}px`;
                };

                const onMouseUp = () => {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };

                this.titleBar.addEventListener('mousedown', (e) => {
                    if (e.target.closest('.controls') || this.isMaximized) return;
                    startX = e.clientX;
                    startY = e.clientY;
                    initX = this.el.offsetLeft;
                    initY = this.el.offsetTop;

                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                });
            }

            initResize() {
                const resizers = this.el.querySelectorAll('.resizer');

                resizers.forEach(resizer => {
                    resizer.addEventListener('mousedown', (e) => {
                        if (this.isMaximized || this.isCollapsed) return;
                        e.preventDefault();

                        const startX = e.clientX;
                        const startY = e.clientY;
                        const startWidth = this.el.offsetWidth;
                        const startHeight = this.el.offsetHeight;
                        const startLeft = this.el.offsetLeft;
                        const startTop = this.el.offsetTop;

                        const onMouseMove = (moveEvent) => {
                            const dx = moveEvent.clientX - startX;
                            const dy = moveEvent.clientY - startY;

                            if (resizer.classList.contains('e') || resizer.classList.contains('ne') || resizer.classList.contains('se')) {
                                const newWidth = startWidth + dx;
                                if (newWidth >= this.minWidth) this.el.style.width = `${newWidth}px`;
                            }
                            if (resizer.classList.contains('s') || resizer.classList.contains('sw') || resizer.classList.contains('se')) {
                                const newHeight = startHeight + dy;
                                if (newHeight >= this.minHeight) this.el.style.height = `${newHeight}px`;
                            }
                            if (resizer.classList.contains('w') || resizer.classList.contains('nw') || resizer.classList.contains('sw')) {
                                const newWidth = startWidth - dx;
                                if (newWidth >= this.minWidth) {
                                    this.el.style.width = `${newWidth}px`;
                                    this.el.style.left = `${startLeft + dx}px`;
                                }
                            }
                            if (resizer.classList.contains('n') || resizer.classList.contains('nw') || resizer.classList.contains('ne')) {
                                const newHeight = startHeight - dy;
                                if (newHeight >= this.minHeight) {
                                    this.el.style.height = `${newHeight}px`;
                                    this.el.style.top = `${startTop + dy}px`;
                                }
                            }
                        };

                        const onMouseUp = () => {
                            document.removeEventListener('mousemove', onMouseMove);
                            document.removeEventListener('mouseup', onMouseUp);
                        };

                        document.addEventListener('mousemove', onMouseMove);
                        document.addEventListener('mouseup', onMouseUp);
                    });
                });
            }

            toggleCollapse() {
                if (!this.isCollapsed) {
                    this.savedHeight = this.el.style.height;
                    this.el.classList.add('collapsed');
                    this.btnCollapse.innerHTML = '&#43;';
                    this.isCollapsed = true;
                } else {
                    this.el.classList.remove('collapsed');
                    this.el.style.height = this.savedHeight;
                    this.btnCollapse.innerHTML = '&#8722;';
                    this.isCollapsed = false;
                }
            }

            toggleMaximize() {
                if (this.isCollapsed) return;
                if (!this.isMaximized) {
                    this.prevRect = {
                        top: this.el.offsetTop,
                        left: this.el.offsetLeft,
                        width: this.el.offsetWidth,
                        height: this.el.offsetHeight
                    };
                    this.el.classList.add('maximized');
                    this.btnMaxRestore.innerHTML = '&#10064;';
                    this.isMaximized = true;
                } else {
                    this.el.classList.remove('maximized');
                    this.el.style.top = `${this.prevRect.top}px`;
                    this.el.style.left = `${this.prevRect.left}px`;
                    this.el.style.width = `${this.prevRect.width}px`;
                    this.el.style.height = `${this.prevRect.height}px`;
                    this.btnMaxRestore.innerHTML = '&#9633;';
                    this.isMaximized = false;
                }
            }

            close() {
                this.el.remove();
            }
        }

        // Template Form Login (Tanpa Placeholder)
        const loginFormTemplate = `
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="client">Client</label>
                    <input type="text" id="client" required>
                </div>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group">
                    <label for="language">Language</label>
                    <select id="language">
                        <option value="en">English (EN)</option>
                        <option value="id">Bahasa Indonesia (ID)</option>
                        <option value="jp">Japanese (JP)</option>
                    </select>
                </div>
                <button type="submit" class="btn-silver btn-submit">Sign In</button>
            </form>
        `;

        // Instance Panel Login
        const loginPanel = new Win11Panel({
            title: 'System Login',
            content: loginFormTemplate,
            x: Math.max(10, (window.innerWidth - 260) / 2),
            y: Math.max(10, (window.innerHeight - 260) / 2),
            width: 260,
            height: 260
        });

        // Submit Logic (Proses Login -> Tampilkan Dashboard)
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            loginPanel.close();
            document.getElementById('dashboard').classList.add('active');
        });

        // Sidebar Resizer Logic (Min 50px, Max Window Width - 50px)
        const sidebar = document.getElementById('sidebar');
        const sidebarResizer = document.getElementById('sidebarResizer');

        sidebarResizer.addEventListener('mousedown', (e) => {
            e.preventDefault();
            const onMouseMove = (moveEvent) => {
                const maxAllowedWidth = window.innerWidth - 50;
                let newWidth = moveEvent.clientX;

                if (newWidth < 50) newWidth = 50;
                if (newWidth > maxAllowedWidth) newWidth = maxAllowedWidth;

                sidebar.style.width = `${newWidth}px`;
            };

            const onMouseUp = () => {
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            };

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });
    </script>
</body>
</html>
